name: P0-B1 applicability contract

on:
  push:
    branches:
      - agent/p0-b0-validation-matrix
    paths:
      - "src/ezctd/applicability.py"
      - "tests/p0_b1/test_applicability_contract.py"
      - "tests/p0_b1/context_map.schema.json"
      - ".github/workflows/p0-b1-applicability-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0-b1-applicability-contract
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-b0-validation-matrix
          fetch-depth: 0

      - name: Synchronize branch
        run: git pull --rebase origin agent/p0-b0-validation-matrix

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate schema syntax and applicability contract
        run: |
          python -m json.tool tests/p0_b1/context_map.schema.json >/dev/null
          python tests/p0_b1/test_applicability_contract.py

      - name: Write and commit success marker
        run: |
          mkdir -p docs/validation/p0-b1
          cat > docs/validation/p0-b1/P0_B1_APPLICABILITY_GATE.md <<'EOF'
          # P0-B1 rule applicability contract: PASS

          Verified by executable tests:

          - reference-node exemptions for 2.7.5, 3.3, 4.3 and 5.4;
          - foreign-reference exemptions;
          - Fast Web View exemptions for 1.0, 1.2, 1.3.8, 1.10, 1.11 and 1.12;
          - rule 6.23 application-form and reference exemptions;
          - rule 6.1 remains applicable in all tested contexts;
          - ordinary study-report context applies all 26 rules.

          This gate validates the encoded applicability contract, not the completeness of the still-unimported official CDE mapping workbook.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/p0-b1/P0_B1_APPLICABILITY_GATE.md
          git commit -m "test(p0-b1): pass PDF rule applicability contract" || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase origin agent/p0-b0-validation-matrix
            if git push origin HEAD:agent/p0-b0-validation-matrix; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload applicability report
        uses: actions/upload-artifact@v4
        with:
          name: p0-b1-applicability-contract
          path: build/p0-b1-applicability-contract.json
          if-no-files-found: error
          retention-days: 30
