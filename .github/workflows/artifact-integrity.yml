name: Artifact integrity

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-corpus.txt

      - name: Validate planning artifacts
        run: python scripts/validate_artifacts.py

      - name: Validate P0-B0 rule matrix
        run: python scripts/validate_p0b0_matrix.py

      - name: Install synthetic corpus dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-corpus.txt

      - name: Generate P0-B0 smoke corpus
        run: python tools/corpus/build_pdf_fixtures.py --output tests/corpus/generated-smoke --mode smoke

      - name: Inspect generated PDF structures
        run: python scripts/inspect_p0b0_smoke.py
