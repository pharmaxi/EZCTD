name: P0-B1 read-only observer gate v2

on:
  push:
    branches:
      - agent/p0-b0-validation-matrix
    paths:
      - "tests/p0_b1/run_readonly_gate.py"
      - ".github/workflows/p0-b1-readonly-observer-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0-b1-readonly-observer-v2
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-b0-validation-matrix
          fetch-depth: 0

      - name: Synchronize branch
        run: git pull --rebase origin agent/p0-b0-validation-matrix

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply current P0-B0/P0-B1 repairs and materialize fixtures
        run: |
          python tools/p0-b0/repair_materializer.py
          python tools/p0-b0/repair_materializer_v2.py
          python tools/p0-b0/repair_materializer_v3.py
          python tools/p0-b0/materialize_p0_b0.py
          python tools/p0-b1/repair_observer.py
          python tools/p0-b0/generate_sample_isolation_audit.py

      - name: Install complete toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
          python -m pip install --upgrade pip
          python -m pip install -r tests/p0_b0/requirements.txt
          python -m pip install -e .

      - name: Run corrected fixture gate
        run: python tests/p0_b0/run_all.py

      - name: Run target coverage and byte-level read-only gate
        run: python tests/p0_b1/run_readonly_gate.py build/p0-b0-smoke

      - name: Write success marker from actual reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          observer=json.loads(Path('build/p0-b1-observer-report.json').read_text(encoding='utf-8'))
          readonly=json.loads(Path('build/p0-b1-readonly-integrity.json').read_text(encoding='utf-8'))
          assert observer['target_hits']==26 and observer['failures']==[] and observer['baseline_findings']==[]
          assert '6.23' not in observer['reference_exemption_findings']
          assert readonly=={'schema_version':'0.1.0','files':28,'unchanged':28,'changed':[],'status':'PASS'}
          Path('docs/validation/p0-b1').mkdir(parents=True,exist_ok=True)
          Path('docs/validation/p0-b1/P0_B1_OBSERVER_GATE.md').write_text(f'''# P0-B1 experimental read-only observer gate: PASS

- Target-rule conditions detected: {observer['target_hits']}/26
- Synthetic control findings: {len(observer['baseline_findings'])}
- Rule 6.23 reference-context false positive: no
- Input PDF hashes unchanged: {readonly['unchanged']}/{readonly['files']}
- Engine status: EXPERIMENTAL_CONTRACT_NOT_CDE_EQUIVALENCE
- CDE validator V1.1.0 observations: 0; NOT_RUN

This gate demonstrates read-only target-condition coverage on the synthetic corpus. It does not establish official sensitivity, specificity, or equivalence.
''',encoding='utf-8')
          PY

      - name: Commit repaired generated sources and success marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/p0-b0/materialize_p0_b0.py src/ezctd tools/p0-b0/generate_sample_isolation_audit.py tests/p0_b0 docs/validation/p0-b0 docs/validation/p0-b1 PROJECT_STATUS.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "P0-B1 v2 success state already committed."
            exit 0
          fi
          git commit -m "feat(p0-b1): pass byte-level read-only observer gate"
          for attempt in 1 2 3 4; do
            git pull --rebase origin agent/p0-b0-validation-matrix
            if git push origin HEAD:agent/p0-b0-validation-matrix; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload P0-B1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-b1-readonly-observer-v2
          path: |
            build/p0-b0-smoke/
            build/p0-b0-gate-report.json
            build/p0-b1-observer-report.json
            build/p0-b1-readonly-integrity.json
          if-no-files-found: error
          retention-days: 30
