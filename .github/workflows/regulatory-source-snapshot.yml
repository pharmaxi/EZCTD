name: Regulatory source snapshot

on:
  push:
    branches:
      - agent/p0-b0-validation-matrix
    paths:
      - "tools/regulatory/fetch_cde_sources.py"
      - ".github/workflows/regulatory-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regulatory-source-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-b0-validation-matrix
          fetch-depth: 0

      - name: Install archive inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Fetch official pages and downloadable assets
        run: python tools/regulatory/fetch_cde_sources.py

      - name: Commit metadata and hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/regulatory/snapshots/cde-2026-v1.1
          if git diff --cached --quiet; then
            echo "No evidence metadata changes."
          else
            git commit -m "evidence(p0): snapshot CDE and ICH regulatory sources"
            for attempt in 1 2 3; do
              git pull --rebase origin agent/p0-b0-validation-matrix
              if git push origin HEAD:agent/p0-b0-validation-matrix; then exit 0; fi
              sleep $((attempt * 5))
            done
            exit 1
          fi

      - name: Upload raw source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cde-ich-source-snapshot
          path: build/regulatory-source-snapshot/
          if-no-files-found: error
          retention-days: 30
