name: Reconnoitre official CDE validator launch v2

on:
  push:
    branches:
      - agent/official-source-deep-dive
    paths:
      - tools/regulatory/Invoke-CDEValidatorLaunchReconV2.ps1
      - .github/workflows/official-validator-launch-recon-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: official-validator-launch-recon-v2
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: "33823274985"
  OUTER_ZIP_SHA256: "d3f143873fb37b78dbc952c8d8d6db5a13a82c5ba5a77798b8319852b9ed2b36"
  INSTALLER_SHA256: "66c5f189e0a3308568ad99e22da6062b7bbf9d61adec757f3f233521c4c7b8f8"
  APP_SHA256: "46b45f511382b5ea448df155a76e6f215713e81a5982494a4227de6825822163"

jobs:
  reconnaissance:
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out probe code without persistent credentials
        uses: actions/checkout@v4
        with:
          ref: agent/official-source-deep-dive
          fetch-depth: 1
          persist-credentials: false

      - name: Download byte-pinned official validator artifact
        uses: actions/download-artifact@v4
        with:
          name: cde-validator-v1.1.0-acquisition-v3-raw
          path: build/acquisition-v3
          repository: laojia-a/EZCTD
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Recover static payload and verify complete hash chain
        id: recover
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem -LiteralPath 'build/acquisition-v3/raw' -Filter '*.zip' -File | Select-Object -First 1
          if (-not $zip) { throw 'Official validator ZIP missing' }
          $zipHash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne $env:OUTER_ZIP_SHA256) { throw "Outer ZIP hash mismatch: $zipHash" }

          New-Item -ItemType Directory -Force -Path 'build/recovered-installer' | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath 'build/recovered-installer' -Force
          $installer = Get-ChildItem -LiteralPath 'build/recovered-installer' -Filter '*.exe' -File -Recurse | Select-Object -First 1
          if (-not $installer) { throw 'Installer missing' }
          $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installerHash -ne $env:INSTALLER_SHA256) { throw "Installer hash mismatch: $installerHash" }

          New-Item -ItemType Directory -Force -Path 'build/payload' | Out-Null
          $sevenZip = (Get-Command 7z).Source
          & $sevenZip x -y -aoa '-obuild/payload' -- $installer.FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Static NSIS payload extraction failed' }
          $app = Get-ChildItem -LiteralPath 'build/payload' -Filter 'eCTD*.exe' -File |
            Where-Object { $_.Name -notmatch '^(?i:uninst|uninstall)' } |
            Select-Object -First 1
          if (-not $app) { throw 'Application entry point missing' }
          $appHash = (Get-FileHash -LiteralPath $app.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($appHash -ne $env:APP_SHA256) { throw "Application hash mismatch: $appHash" }
          "application=$($app.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Remove repository authentication residue before binary execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath '.git/config') {
            git config --local --unset-all http.https://github.com/.extraheader 2>$null
          }
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:ACTIONS_ID_TOKEN_REQUEST_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:ACTIONS_RUNTIME_TOKEN -ErrorAction SilentlyContinue
          $config = Get-Content -Raw -LiteralPath '.git/config'
          if ($config -match '(?i)authorization|extraheader') { throw 'Repository credential residue remains' }

      - name: Launch exact official application in reconnaissance mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/regulatory/Invoke-CDEValidatorLaunchReconV2.ps1 `
            -ApplicationPath '${{ steps.recover.outputs.application }}' `
            -PayloadDirectory 'build/payload' `
            -OutputDirectory 'build/launch-recon-v2' `
            -ExpectedApplicationSha256 $env:APP_SHA256 `
            -ObservationSeconds 45

      - name: Validate non-overclaiming reconnaissance contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'build/launch-recon-v2/launch-recon-result.json'
          if (-not (Test-Path -LiteralPath $path)) { throw 'Launch reconnaissance result missing' }
          $data = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
          if ($data.run_type -ne 'launch_reconnaissance') { throw 'Unexpected run type' }
          if ($data.observation_counters.launch_reconnaissance_runs -ne 1) { throw 'Reconnaissance count must be one' }
          if ($data.observation_counters.completed_validation_runs -ne 0) { throw 'Launch probe cannot count as completed validation' }
          if ($data.observation_counters.official_black_box_observations -ne 0) { throw 'Launch probe cannot count as official observation' }
          if ($data.assertions.validation_invoked) { throw 'Validation must not be invoked in launch reconnaissance' }
          if ($data.assertions.native_validation_report_present) { throw 'Unexpected native report claim' }
          if ($data.validator.application_sha256 -ne $env:APP_SHA256) { throw 'Application identity was not conserved' }
          if ($data.environment.environment_representativeness -ne 'exploratory_outside_manual_recommendation') {
            throw 'Hosted Server environment must remain qualified as exploratory'
          }
          Get-Content -Raw -LiteralPath 'build/launch-recon-v2/launch-recon-result.md' | Write-Host

      - name: Upload raw reconnaissance evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: cde-validator-v1.1.0-launch-recon-v2
          path: build/launch-recon-v2/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  commit-evidence:
    needs: reconnaissance
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest evidence branch
        uses: actions/checkout@v4
        with:
          ref: agent/official-source-deep-dive
          fetch-depth: 0

      - name: Download raw reconnaissance evidence
        uses: actions/download-artifact@v4
        with:
          name: cde-validator-v1.1.0-launch-recon-v2
          path: build/launch-recon-v2
          repository: laojia-a/EZCTD
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Generate bounded repository evidence and update counters
        env:
          RAW_ARTIFACT_ID: ${{ needs.reconnaissance.outputs.artifact_id }}
          RAW_ARTIFACT_URL: ${{ needs.reconnaissance.outputs.artifact_url }}
          RAW_ARTIFACT_DIGEST: ${{ needs.reconnaissance.outputs.artifact_digest }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path

          raw = Path('build/launch-recon-v2/launch-recon-result.json')
          data = json.loads(raw.read_text(encoding='utf-8-sig'))
          evidence_root = Path('evidence/regulatory/snapshots/cde-validator-v1.1.0/launch-reconnaissance')
          evidence_root.mkdir(parents=True, exist_ok=True)
          status_root = Path('docs/status')
          status_root.mkdir(parents=True, exist_ok=True)

          execution = data['execution']
          side = data['side_effects']
          counters = data['observation_counters']
          summary = {
              'schema_version': '0.2.0',
              'run_id': data['run_id'],
              'run_type': data['run_type'],
              'classification': data['classification'],
              'execution_mode': data['execution_mode'],
              'environment': data['environment'],
              'validator': data['validator'],
              'safety': data['safety'],
              'execution_summary': {
                  'start_succeeded': execution['start_succeeded'],
                  'start_error': execution['start_error'],
                  'observed_process_count': len(execution['observed_processes']),
                  'observed_processes': execution['observed_processes'],
                  'observed_window_count': len(execution['observed_windows']),
                  'observed_windows': execution['observed_windows'],
                  'observed_visible_window_count': execution['observed_visible_window_count'],
                  'ui_automation_status': execution['ui_automation']['status'],
                  'ui_automation_window_count': len(execution['ui_automation'].get('windows', [])),
                  'screenshot': execution['screenshot'],
                  'started_at': execution['started_at'],
                  'finished_at': execution['finished_at'],
              },
              'side_effect_summary': {
                  'payload_inventory_sha256_before': side['payload_inventory_sha256_before'],
                  'payload_inventory_sha256_after': side['payload_inventory_sha256_after'],
                  'payload_unchanged': side['payload_unchanged'],
                  'added_file_count': len(side['added_files']),
                  'removed_file_count': len(side['removed_files']),
                  'modified_file_count': len(side['modified_files']),
                  'recent_file_count': side['recent_file_count'],
              },
              'assertions': data['assertions'],
              'observation_counters': counters,
              'interpretation': data['interpretation'],
              'raw_evidence': {
                  'workflow_run_id': int(os.environ['WORKFLOW_RUN_ID']),
                  'workflow_run_attempt': int(os.environ['WORKFLOW_RUN_ATTEMPT']),
                  'artifact_id': os.environ['RAW_ARTIFACT_ID'],
                  'artifact_url': os.environ['RAW_ARTIFACT_URL'],
                  'artifact_digest': os.environ['RAW_ARTIFACT_DIGEST'],
                  'retention_days': 90,
              },
          }
          (evidence_root / 'CDE-V110-LAUNCH-RECON-001.summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          source_md = Path('build/launch-recon-v2/launch-recon-result.md').read_text(encoding='utf-8-sig')
          source_md += (
              '\n## 原始证据定位\n\n'
              f"- Workflow run: `{os.environ['WORKFLOW_RUN_ID']}`\n"
              f"- Artifact ID: `{os.environ['RAW_ARTIFACT_ID']}`\n"
              f"- Artifact digest: `{os.environ['RAW_ARTIFACT_DIGEST']}`\n"
              '- Retention: 90 days\n'
          )
          (evidence_root / 'CDE-V110-LAUNCH-RECON-001.md').write_text(source_md, encoding='utf-8')

          existing_path = Path('evidence/regulatory/snapshots/cde-validator-v1.1.0/STATUS.json')
          status = json.loads(existing_path.read_text(encoding='utf-8')) if existing_path.exists() else {}
          status.update({
              'schema_version': '0.3.0',
              'status': 'OFFICIAL_APPLICATION_LAUNCH_RECONNAISSANCE_COMPLETED',
              'launch_reconnaissance_runs': counters['launch_reconnaissance_runs'],
              'completed_validation_runs': counters['completed_validation_runs'],
              'admissible_black_box_observations': counters['admissible_black_box_observations'],
              'calibration_informative_observations': counters['calibration_informative_observations'],
              'repeated_baseline_controls': counters['repeated_baseline_controls'],
              'official_black_box_observations': counters['official_black_box_observations'],
              'software_executed': data['assertions']['software_executed'],
              'launch_reconnaissance': {
                  'run_id': data['run_id'],
                  'classification': data['classification'],
                  'start_succeeded': execution['start_succeeded'],
                  'observed_process_count': len(execution['observed_processes']),
                  'observed_window_count': len(execution['observed_windows']),
                  'observed_visible_window_count': execution['observed_visible_window_count'],
                  'ui_automation_status': execution['ui_automation']['status'],
                  'payload_unchanged': side['payload_unchanged'],
                  'environment_representativeness': data['environment']['environment_representativeness'],
                  'raw_evidence': summary['raw_evidence'],
              },
              'next_gate': data['interpretation']['next_gate'],
              'boundary': 'The official application has been launch-probed only. No sequence was selected, no validation was invoked, and no native report was produced; official black-box observations therefore remain zero.',
          })
          existing_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (status_root / 'OFFICIAL_VALIDATOR_BLACK_BOX_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          md = [
              '# CDE eCTD 验证软件黑盒状态',
              '',
              f"- 当前状态：**{status['status']}**",
              f"- 启动侦察：**{status['launch_reconnaissance_runs']}**",
              f"- 完整验证运行：**{status['completed_validation_runs']}**",
              f"- 可采信黑盒观察：**{status['admissible_black_box_observations']}**",
              f"- 可用于规则校准的观察：**{status['calibration_informative_observations']}**",
              f"- 兼容字段 `official_black_box_observations`：**{status['official_black_box_observations']}**",
              '',
              '## 本阶段证明了什么',
              '',
              f"官方应用启动侦察分类为 `{data['classification']}`；记录了 {len(execution['observed_processes'])} 个相关进程、{len(execution['observed_windows'])} 个窗口，payload 启动前后完整性为 `{side['payload_unchanged']}`。",
              '',
              '## 为什么正式观察仍为 0',
              '',
              '因为本阶段明确禁止选择序列和触发验证，也没有原生验证报告。把“应用启动成功”记作一次官方验证观察会造成证据含义错误。',
              '',
              '## 下一门槛',
              '',
              status['next_gate'],
              '',
              f"原始证据：workflow `{os.environ['WORKFLOW_RUN_ID']}`，artifact `{os.environ['RAW_ARTIFACT_ID']}`，digest `{os.environ['RAW_ARTIFACT_DIGEST']}`。",
              '',
          ]
          (status_root / 'OFFICIAL_VALIDATOR_BLACK_BOX_STATUS.md').write_text('\n'.join(md), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Commit bounded reconnaissance evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/regulatory/snapshots/cde-validator-v1.1.0/launch-reconnaissance \
            evidence/regulatory/snapshots/cde-validator-v1.1.0/STATUS.json \
            docs/status/OFFICIAL_VALIDATOR_BLACK_BOX_STATUS.json \
            docs/status/OFFICIAL_VALIDATOR_BLACK_BOX_STATUS.md
          if git diff --cached --quiet; then
            echo 'No reconnaissance evidence changes.'
            exit 0
          fi
          git commit -m 'research(regulatory): record official validator launch reconnaissance'
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/official-source-deep-dive
            if git rebase origin/agent/official-source-deep-dive && \
               git push origin HEAD:agent/official-source-deep-dive; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
