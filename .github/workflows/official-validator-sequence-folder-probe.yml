name: Probe official validator sequence-folder semantics

on:
  push:
    branches:
      - agent/official-validator-black-box-loop
    paths:
      - rulepacks/cn-cde-ectd/v1.1/black-box-cases/cn-v11-probe-001-invalid-empty-root-0001.json
      - tools/regulatory/run_cde_validator_synthetic_transaction_v3.py
      - tools/regulatory/finalize_cde_validator_transaction_evidence_v2.py
      - tools/regulatory/parse_cde_validator_native_report.py
      - tools/regulatory/analyze_cde_validator_sequence_folder_probe.py
      - .github/workflows/official-validator-sequence-folder-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: official-validator-sequence-folder-probe
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: "33823274985"
  OUTER_ZIP_SHA256: "d3f143873fb37b78dbc952c8d8d6db5a13a82c5ba5a77798b8319852b9ed2b36"
  INSTALLER_SHA256: "66c5f189e0a3308568ad99e22da6062b7bbf9d61adec757f3f233521c4c7b8f8"
  APP_SHA256: "46b45f511382b5ea448df155a76e6f215713e81a5982494a4227de6825822163"
  CASE_PATH: "rulepacks/cn-cde-ectd/v1.1/black-box-cases/cn-v11-probe-001-invalid-empty-root-0001.json"
  INPUT_ROOT: "C:\\EZCTDProbeInput\\0001"
  REPORT_ROOT: "C:\\EZCTDProbeReports0001"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  probe:
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out black-box loop branch without persistent credentials
        uses: actions/checkout@v4
        with:
          ref: agent/official-validator-black-box-loop
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded UI automation dependencies and compile harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check psutil pywinauto pillow
          python -X utf8 -m py_compile `
            tools/regulatory/build_black_box_probe_fixture.py `
            tools/regulatory/prepare_cde_validator_transaction_runtime.py `
            tools/regulatory/run_cde_validator_synthetic_transaction.py `
            tools/regulatory/run_cde_validator_synthetic_transaction_v2.py `
            tools/regulatory/run_cde_validator_synthetic_transaction_v3.py `
            tools/regulatory/finalize_cde_validator_transaction_evidence.py `
            tools/regulatory/finalize_cde_validator_transaction_evidence_v2.py `
            tools/regulatory/parse_cde_validator_native_report.py `
            tools/regulatory/analyze_cde_validator_sequence_folder_probe.py `
            tools/regulatory/stage_cde_validator_synthetic_transaction.py

      - name: Download byte-pinned official validator source artifact
        uses: actions/download-artifact@v4
        with:
          name: cde-validator-v1.1.0-acquisition-v3-raw
          path: build/acquisition-v3
          repository: laojia-a/EZCTD
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Recover official installer with complete upstream hash verification
        id: recover
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outer = Get-ChildItem -LiteralPath 'build/acquisition-v3/raw' -Filter '*.zip' -File | Select-Object -First 1
          if (-not $outer) { throw 'Official validator ZIP missing' }
          $outerHash = (Get-FileHash -LiteralPath $outer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($outerHash -ne $env:OUTER_ZIP_SHA256) { throw "Outer ZIP hash mismatch: $outerHash" }
          New-Item -ItemType Directory -Force -Path 'build/recovered-installer' | Out-Null
          Expand-Archive -LiteralPath $outer.FullName -DestinationPath 'build/recovered-installer' -Force
          $installer = Get-ChildItem -LiteralPath 'build/recovered-installer' -Filter '*.exe' -File -Recurse | Select-Object -First 1
          if (-not $installer) { throw 'Installer missing after outer ZIP extraction' }
          $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installerHash -ne $env:INSTALLER_SHA256) { throw "Installer hash mismatch: $installerHash" }
          "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Freeze and verify the isolated 0001 empty-root case
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -X utf8 tools/regulatory/build_black_box_probe_fixture.py `
            --case $env:CASE_PATH `
            --output 'build/fixture-contract'

      - name: Prepare clean byte-identical runtime without launching the application
        id: prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -X utf8 tools/regulatory/prepare_cde_validator_transaction_runtime.py `
            --installer '${{ steps.recover.outputs.installer }}' `
            --install-dir 'C:\\CDEValidatorPathProbeRuntime' `
            --output 'build/runtime-preparation' `
            --expected-installer-sha256 $env:INSTALLER_SHA256 `
            --expected-app-sha256 $env:APP_SHA256 `
            --github-output $env:GITHUB_OUTPUT

      - name: Execute one bounded official-validator 0001 transaction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -X utf8 tools/regulatory/run_cde_validator_synthetic_transaction_v3.py `
            --application '${{ steps.prepare.outputs.application_alias }}' `
            --original-application '${{ steps.prepare.outputs.original_application }}' `
            --expected-app-sha256 $env:APP_SHA256 `
            --case-definition $env:CASE_PATH `
            --output 'build/official-validator-path-probe' `
            --input-root $env:INPUT_ROOT `
            --report-root $env:REPORT_ROOT `
            --terminal-timeout 180

      - name: Conserve native output and finalize reached gates independently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -X utf8 tools/regulatory/finalize_cde_validator_transaction_evidence_v2.py `
            --transaction 'build/official-validator-path-probe/synthetic-transaction.json' `
            --report-root $env:REPORT_ROOT `
            --application-dir '${{ steps.prepare.outputs.application_dir }}' `
            --output-root 'build/official-validator-path-probe'

      - name: Parse native HTML and compare with the frozen three-run 0000 control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Get-ChildItem -LiteralPath 'build/official-validator-path-probe/native-output' -Filter '*.html' -File | Sort-Object LastWriteTimeUtc | Select-Object -Last 1
          if (-not $report) { throw 'Native validator HTML report missing' }
          python -X utf8 tools/regulatory/parse_cde_validator_native_report.py `
            --report $report.FullName `
            --json 'build/official-validator-path-probe/native-report-semantics.json' `
            --markdown 'build/official-validator-path-probe/native-report-semantics.md'
          python -X utf8 tools/regulatory/analyze_cde_validator_sequence_folder_probe.py `
            --transaction 'build/official-validator-path-probe/synthetic-transaction.json' `
            --native-summary 'build/official-validator-path-probe/native-report-semantics.json' `
            --control-stability 'evidence/regulatory/snapshots/cde-validator-v1.1.0/black-box-stability/cn-v11-probe-000-invalid-empty-root-three-run-stability.json' `
            --json 'build/official-validator-path-probe/sequence-folder-probe.json' `
            --markdown 'build/official-validator-path-probe/sequence-folder-probe.md'

      - name: Enforce the non-calibration observation contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $transaction = Get-Content -Raw -LiteralPath 'build/official-validator-path-probe/synthetic-transaction.json' | ConvertFrom-Json
          $analysis = Get-Content -Raw -LiteralPath 'build/official-validator-path-probe/sequence-folder-probe.json' | ConvertFrom-Json
          $count = [int]$transaction.observation_counters.official_black_box_observations
          if ($count -ne 1) { throw "0001 probe was not an admissible official observation: $count" }
          if ([int]$transaction.observation_counters.calibration_informative_observations -ne 0) { throw 'Path probe must not count as rule calibration' }
          if (-not $analysis.probe.admissible) { throw 'Path-probe analyzer rejected the transaction' }
          if (-not $analysis.probe.validation_invoked) { throw 'Validation was not invoked' }
          if (-not $analysis.probe.native_report_present) { throw 'Native report was not preserved' }
          if ($analysis.probe.input_unchanged -ne $true) { throw 'Input integrity failed' }
          Write-Host "conclusion=$($analysis.conclusion)"
          Write-Host "warning_persists=$($analysis.comparison.warning_persists_with_0001)"
          Write-Host "same_rule_count=$($analysis.comparison.same_rule_count_as_control)"
          Write-Host "same_severity_totals=$($analysis.comparison.same_severity_totals_as_control)"

      - name: Upload complete 0001 path-probe evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cde-validator-v1.1.0-sequence-folder-probe-0001
          path: |
            build/official-validator-path-probe/
            build/runtime-preparation/
            build/fixture-contract/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  commit-evidence:
    needs: probe
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest black-box loop branch
        uses: actions/checkout@v4
        with:
          ref: agent/official-validator-black-box-loop
          fetch-depth: 0

      - name: Download this run's path-probe evidence
        uses: actions/download-artifact@v4
        with:
          name: cde-validator-v1.1.0-sequence-folder-probe-0001
          path: build/path-probe-artifact
          repository: laojia-a/EZCTD
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Stage bounded observation and path-probe comparison
        env:
          RAW_ARTIFACT_ID: ${{ needs.probe.outputs.artifact_id }}
          RAW_ARTIFACT_URL: ${{ needs.probe.outputs.artifact_url }}
          RAW_ARTIFACT_DIGEST: ${{ needs.probe.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          transaction=$(find build/path-probe-artifact -type f -name synthetic-transaction.json -print -quit)
          analysis=$(find build/path-probe-artifact -type f -name sequence-folder-probe.json -print -quit)
          analysis_md=$(find build/path-probe-artifact -type f -name sequence-folder-probe.md -print -quit)
          native_json=$(find build/path-probe-artifact -type f -name native-report-semantics.json -print -quit)
          native_md=$(find build/path-probe-artifact -type f -name native-report-semantics.md -print -quit)
          test -n "$transaction" && test -n "$analysis" && test -n "$analysis_md" && test -n "$native_json" && test -n "$native_md"
          python tools/regulatory/stage_cde_validator_synthetic_transaction.py \
            --transaction "$transaction" \
            --workflow-run-id '${{ github.run_id }}' \
            --workflow-run-attempt '${{ github.run_attempt }}' \
            --artifact-id "$RAW_ARTIFACT_ID" \
            --artifact-url "$RAW_ARTIFACT_URL" \
            --artifact-digest "$RAW_ARTIFACT_DIGEST"
          target='evidence/regulatory/snapshots/cde-validator-v1.1.0/black-box-path-probes/cn-v11-probe-001-invalid-empty-root-0001'
          mkdir -p "$target"
          cp "$analysis" "$target/sequence-folder-probe.json"
          cp "$analysis_md" "$target/sequence-folder-probe.md"
          cp "$native_json" "$target/native-report-semantics.json"
          cp "$native_md" "$target/native-report-semantics.md"

      - name: Commit evidence with retry-safe rebase
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/regulatory/snapshots/cde-validator-v1.1.0/black-box-observations \
            evidence/regulatory/snapshots/cde-validator-v1.1.0/black-box-path-probes \
            evidence/regulatory/snapshots/cde-validator-v1.1.0/STATUS.json \
            docs/status/OFFICIAL_VALIDATOR_BLACK_BOX_STATUS.json \
            docs/status/OFFICIAL_VALIDATOR_BLACK_BOX_STATUS.md
          if git diff --cached --quiet; then
            echo 'No path-probe evidence changes.'
            exit 0
          fi
          git commit -m 'research(regulatory): record isolated 0001 sequence-folder probe'
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/official-validator-black-box-loop
            if git rebase origin/agent/official-validator-black-box-loop && \
               git push origin HEAD:agent/official-validator-black-box-loop; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
