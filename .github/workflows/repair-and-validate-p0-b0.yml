name: Repair and validate P0-B0

on:
  push:
    branches:
      - agent/p0-b0-validation-matrix
    paths:
      - "tools/p0-b0/repair_materializer.py"
      - ".github/workflows/repair-and-validate-p0-b0.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-p0-b0
  cancel-in-progress: false

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-b0-validation-matrix
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/p0_b0/requirements.txt

      - name: Patch source materializer
        run: python tools/p0-b0/repair_materializer.py

      - name: Regenerate P0-B0 baseline
        run: python tools/p0-b0/materialize_p0_b0.py

      - name: Install native and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
          python -m pip install --upgrade pip
          python -m pip install -r tests/p0_b0/requirements.txt

      - name: Run complete synthetic gate
        run: python tests/p0_b0/run_all.py

      - name: Build official-run archive
        run: python tests/p0_b0/package_for_official_run.py --smoke-dir build/p0-b0-smoke --manifest tests/p0_b0/smoke_manifest.json --output build/ezctd-p0-b0-official-run.zip

      - name: Commit repaired source and generated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/p0-b0/materialize_p0_b0.py .github/workflows/p0-b0-validation.yml docs/validation/p0-b0 tests/p0_b0 tools/cde-validator PROJECT_STATUS.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No tracked changes to commit."
          else
            git commit -m "test(p0-b0): complete deterministic synthetic validation gate"
            git push origin HEAD:agent/p0-b0-validation-matrix
          fi

      - name: Upload gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p0-b0-repair-gate
          path: |
            build/p0-b0-smoke/
            build/p0-b0-gate-report.json
            build/ezctd-p0-b0-official-run.zip
          if-no-files-found: error
