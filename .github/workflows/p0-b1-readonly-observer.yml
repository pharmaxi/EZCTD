name: P0-B1 read-only observer gate

on:
  push:
    branches:
      - agent/p0-b0-validation-matrix
    paths:
      - "src/ezctd/**"
      - "tests/p0_b1/**"
      - "tools/p0-b1/**"
      - "pyproject.toml"
      - ".github/workflows/p0-b1-readonly-observer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0-b1-readonly-observer
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-b0-validation-matrix
          fetch-depth: 0

      - name: Synchronize branch
        run: git pull --rebase origin agent/p0-b0-validation-matrix

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply test-harness and observer repairs
        run: |
          python tools/p0-b0/repair_materializer.py
          python tools/p0-b0/repair_materializer_v2.py
          python tools/p0-b0/repair_materializer_v3.py
          python tools/p0-b0/materialize_p0_b0.py
          python tools/p0-b1/repair_observer.py
          python tools/p0-b0/generate_sample_isolation_audit.py

      - name: Install qpdf and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
          python -m pip install --upgrade pip
          python -m pip install -r tests/p0_b0/requirements.txt
          python -m pip install -e .

      - name: Re-run P0-B0 corrected synthetic gate
        run: python tests/p0_b0/run_all.py

      - name: Run P0-B1 observer target-coverage gate
        run: python tests/p0_b1/run_smoke_observer.py build/p0-b0-smoke

      - name: Write success-only observer gate record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build/p0-b1-observer-report.json').read_text(encoding='utf-8'))
          assert report['cases'] == 28
          assert report['target_hits'] == 26
          assert report['baseline_findings'] == []
          assert '6.23' not in report['reference_exemption_findings']
          assert report['failures'] == []
          content = f'''# P0-B1 experimental read-only observer gate: PASS

- Target-positive PDF rules detected: {report['target_hits']}/26
- Baseline findings: {len(report['baseline_findings'])}
- Rule 6.23 reference-context false positive: no
- Input mutation or repair: none; observer is read-only
- Engine status: EXPERIMENTAL_CONTRACT_NOT_CDE_EQUIVALENCE
- CDE validator V1.1.0 observations: 0; NOT_RUN

The gate proves target-condition coverage on the synthetic corpus. It does not establish sensitivity, specificity, or equivalence on real dossiers or the official CDE validator.
'''
          Path('docs/validation/p0-b1').mkdir(parents=True, exist_ok=True)
          Path('docs/validation/p0-b1/P0_B1_OBSERVER_GATE.md').write_text(content, encoding='utf-8')
          Path('docs/validation/p0-b1/README.md').write_text('''# P0-B1 read-only observer

This stage converts the verified rule metadata and P0-B0 detector contracts into a read-only experimental observation kernel. It never modifies input PDFs. Official calibration remains pending.
''', encoding='utf-8')
          PY

      - name: Commit repairs, generated audit and success marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/p0-b0/materialize_p0_b0.py src/ezctd tools/p0-b0/generate_sample_isolation_audit.py tests/p0_b0 docs/validation/p0-b0 docs/validation/p0-b1 PROJECT_STATUS.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Observer gate state already committed."
            exit 0
          fi
          git commit -m "feat(p0-b1): pass read-only PDF observer smoke gate"
          for attempt in 1 2 3 4; do
            git pull --rebase origin agent/p0-b0-validation-matrix
            if git push origin HEAD:agent/p0-b0-validation-matrix; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload gate reports and generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: p0-b1-readonly-observer-gate
          path: |
            build/p0-b0-smoke/
            build/p0-b0-gate-report.json
            build/p0-b1-observer-report.json
          if-no-files-found: error
          retention-days: 30
