name: Analyze eCTD technical packages

on:
  push:
    branches:
      - agent/p0-b0-validation-matrix
    paths:
      - "tools/regulatory/analyze_ectd_packages.py"
      - "tools/regulatory/fetch_cde_sources.py"
      - ".github/workflows/analyze-ectd-technical-packages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyze-ectd-technical-packages
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-b0-validation-matrix
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Fetch source assets
        run: python tools/regulatory/fetch_cde_sources.py

      - name: Analyze archives, XML and utility packages
        run: python tools/regulatory/analyze_ectd_packages.py

      - name: Commit evidence-constrained baseline specification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/regulatory/snapshots/ectd-package-analysis evidence/regulatory/snapshots/cde-2026-v1.1
          if git diff --cached --quiet; then
            echo "No package-analysis changes."
            exit 0
          fi
          git commit -m "research(p0): analyze eCTD technical packages and baseline evidence"
          for attempt in 1 2 3 4; do
            git pull --rebase origin agent/p0-b0-validation-matrix
            if git push origin HEAD:agent/p0-b0-validation-matrix; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload extracted static analysis
        uses: actions/upload-artifact@v4
        with:
          name: ectd-technical-package-analysis
          path: |
            build/regulatory-source-snapshot/
            build/ectd-package-analysis/
          if-no-files-found: warn
          retention-days: 30
