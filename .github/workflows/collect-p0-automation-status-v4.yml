name: Collect P0 automation status v4

on:
  push:
    branches:
      - agent/p0-b0-validation-matrix
    paths:
      - "tools/ci/collect_p0_automation_status_v4.py"
      - ".github/workflows/collect-p0-automation-status-v4.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: collect-p0-automation-status-v4
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-b0-validation-matrix
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for convergence and write fixed-field status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          P0_BRANCH: agent/p0-b0-validation-matrix
        run: python tools/ci/collect_p0_automation_status_v4.py

      - name: Commit status and sentinel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status/P0_AUTOMATION_STATUS_V4.json docs/status/P0_AUTOMATION_STATUS_V4.md docs/status/P0_SENTINEL.txt
          if git diff --cached --quiet; then
            echo "No status changes."
            exit 0
          fi
          git commit -m "docs(p0): write unambiguous convergence status sentinel"
          for attempt in 1 2 3 4; do
            git pull --rebase origin agent/p0-b0-validation-matrix
            if git push origin HEAD:agent/p0-b0-validation-matrix; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
