name: CRO PDF core
on:
  workflow_dispatch:
  push:
    branches: [agent/cro-pdf-safety-intake]
    paths:
      - 'src/**'
      - 'tests/cro_pdf/**'
      - 'pyproject.toml'
      - '.github/workflows/cro-pdf-core.yml'
permissions:
  contents: read
concurrency:
  group: cro-pdf-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core and focused test dependencies
        run: python -m pip install -e . pytest Pillow "pikepdf==10.5.0"
      - name: Prepare evidence directory
        run: python -c "from pathlib import Path; Path('build/cro-core').mkdir(parents=True, exist_ok=True)"
      - name: Focused safety and PDF core tests
        run: python -m pytest -q tests/cro_pdf --junitxml=build/cro-core/junit.xml
      - name: Preserve tested source and dependency versions
        if: always()
        shell: bash
        run: |
          git archive HEAD -o build/cro-core/source.zip
          git rev-parse HEAD > build/cro-core/source-commit.txt
          python -m pip freeze > build/cro-core/dependencies.txt
      - name: Export public binary wheel for isolated Linux development
        if: runner.os == 'Linux'
        run: python -m pip download --no-deps --only-binary=:all: --platform manylinux_2_28_x86_64 --python-version 313 --implementation cp --abi cp313 --dest build/cro-core/wheels "pikepdf==10.5.0"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cro-pdf-core-${{ runner.os }}
          path: build/cro-core/
          retention-days: 30
          if-no-files-found: error
