name: Finalize P0-B0 synthetic gate v2

on:
  push:
    branches:
      - agent/p0-b0-validation-matrix
    paths:
      - "tools/p0-b0/repair_materializer_v2.py"
      - ".github/workflows/finalize-p0-b0-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-p0-b0-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-b0-validation-matrix
          fetch-depth: 0

      - name: Synchronize branch
        run: git pull --rebase origin agent/p0-b0-validation-matrix

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply all source repairs
        run: |
          python tools/p0-b0/repair_materializer.py
          python tools/p0-b0/repair_materializer_v2.py

      - name: Regenerate tracked validation sources
        run: python tools/p0-b0/materialize_p0_b0.py

      - name: Install complete test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
          python -m pip install --upgrade pip
          python -m pip install -r tests/p0_b0/requirements.txt

      - name: Run corrected P0-B0-A gate
        run: python tests/p0_b0/run_all.py

      - name: Package official-validator input set
        run: python tests/p0_b0/package_for_official_run.py --smoke-dir build/p0-b0-smoke --manifest tests/p0_b0/smoke_manifest.json --output build/ezctd-p0-b0-official-run.zip

      - name: Write success-only gate record from actual report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build/p0-b0-gate-report.json').read_text(encoding='utf-8'))
          required = {
              'status': 'PASS',
              'rules': 26,
              'case_recipes': 130,
              'smoke': 28,
              'self_check': 28,
              'pdfium': 28,
              'qpdf': 28,
              'fixture_reproducibility': 28,
              'official_observations': 0,
              'official_status': 'NOT_RUN',
          }
          for key, value in required.items():
              if report.get(key) != value:
                  raise SystemExit(f'gate report mismatch: {key}={report.get(key)!r}, expected {value!r}')
          exact = report['exact_byte_reproducibility']
          encrypted = report['encrypted_canonical_semantic_reproducibility']
          if exact + encrypted != 28 or encrypted != 2:
              raise SystemExit(f'unexpected reproducibility split: exact={exact}, encrypted={encrypted}')
          content = f'''# P0-B0-A CI gate: PASS

- Workflow: Finalize P0-B0 synthetic gate v2
- Rules: 26
- Case recipes: 130
- Smoke PDFs: 28
- Object self-checks: 28/28
- PDFium expected outcomes: 28/28
- qpdf expected outcomes: 28/28
- Fixture reproducibility: 28/28
- Exact-byte ordinary PDF comparisons: {exact}
- Decrypted canonical semantic comparisons for encrypted PDFs: {encrypted}
- Differential eCTD package harness self-test: PASS
- CDE validator V1.1.0 observations: 0; NOT_RUN

This marker proves only the synthetic fixture and probe gate. It does not claim agreement with the CDE validator.
'''
          Path('docs/validation/p0-b0/CI_GATE_PASS.md').write_text(content, encoding='utf-8')
          PY

      - name: Commit only after all corrected gates pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/p0-b0/materialize_p0_b0.py .github/workflows/finalize-p0-b0.yml .github/workflows/p0-b0-validation.yml docs/validation/p0-b0 tests/p0_b0 tools/cde-validator PROJECT_STATUS.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Corrected success-state already committed."
            exit 0
          fi
          git commit -m "test(p0-b0): pass corrected deterministic validation gate"
          for attempt in 1 2 3 4; do
            git pull --rebase origin agent/p0-b0-validation-matrix
            if git push origin HEAD:agent/p0-b0-validation-matrix; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload reproducible test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p0-b0-final-gate-v2
          path: |
            build/p0-b0-smoke/
            build/p0-b0-gate-report.json
            build/ezctd-p0-b0-official-run.zip
          if-no-files-found: error
          retention-days: 30
