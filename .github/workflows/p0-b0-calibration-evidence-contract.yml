name: P0-B0 calibration evidence contract

on:
  push:
    branches:
      - agent/p0-b0-validation-matrix
    paths:
      - "tests/p0_b0/official-validator/calibration_manifest.json"
      - "tests/p0_b0/official-validator/calibration_run_plan.json"
      - "tests/p0_b0/official-validator/test_calibration_summarizer.py"
      - "tools/cde-validator/summarize_calibration_batch.py"
      - ".github/workflows/p0-b0-calibration-evidence-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0-b0-calibration-evidence-contract
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-b0-validation-matrix
          fetch-depth: 0

      - name: Synchronize branch
        run: git pull --rebase origin agent/p0-b0-validation-matrix

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON and evidence summarizer behavior
        run: |
          python -m json.tool tests/p0_b0/official-validator/calibration_manifest.json >/dev/null
          python -m json.tool tests/p0_b0/official-validator/calibration_run_plan.json >/dev/null
          python tests/p0_b0/official-validator/test_calibration_summarizer.py

      - name: Write success-only contract marker
        run: |
          mkdir -p docs/validation/p0-b0
          cat > docs/validation/p0-b0/CALIBRATION_EVIDENCE_CONTRACT_GATE.md <<'EOF'
          # Official-validator calibration evidence contract: PASS

          The self-test proves that the batch summarizer:

          - accepts nine internally complete synthetic evidence records;
          - requires one validator version and binary SHA-256;
          - requires one baseline ID;
          - requires six target-rule observations;
          - requires three baseline controls without section-6 messages;
          - rejects a missing screenshot;
          - rejects a contaminated baseline control.

          This is a schema and evidence-completeness test only. CDE validation software V1.1.0 observations remain 0 / NOT_RUN.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/p0-b0/CALIBRATION_EVIDENCE_CONTRACT_GATE.md
          git commit -m "test(p0-b0): pass official calibration evidence contract" || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase origin agent/p0-b0-validation-matrix
            if git push origin HEAD:agent/p0-b0-validation-matrix; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload contract self-test report
        uses: actions/upload-artifact@v4
        with:
          name: p0-b0-calibration-evidence-contract
          path: build/calibration-summarizer-self-test.json
          if-no-files-found: error
          retention-days: 30
