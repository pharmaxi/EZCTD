name: Finalize P0-B0 synthetic gate

on:
  push:
    branches:
      - agent/p0-b0-validation-matrix
    paths:
      - ".github/workflows/finalize-p0-b0.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-p0-b0
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-b0-validation-matrix
          fetch-depth: 0

      - name: Synchronize branch before generation
        run: git pull --rebase origin agent/p0-b0-validation-matrix

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair source materializer idempotently
        run: python tools/p0-b0/repair_materializer.py

      - name: Materialize all tracked P0-B0 sources
        run: python tools/p0-b0/materialize_p0_b0.py

      - name: Install complete test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
          python -m pip install --upgrade pip
          python -m pip install -r tests/p0_b0/requirements.txt

      - name: Run complete P0-B0-A gate
        run: python tests/p0_b0/run_all.py

      - name: Package official-validator inputs
        run: python tests/p0_b0/package_for_official_run.py --smoke-dir build/p0-b0-smoke --manifest tests/p0_b0/smoke_manifest.json --output build/ezctd-p0-b0-official-run.zip

      - name: Write success-only gate record
        shell: bash
        run: |
          cat > docs/validation/p0-b0/CI_GATE_PASS.md <<EOF
          # P0-B0-A CI gate: PASS

          - Workflow: Finalize P0-B0 synthetic gate
          - Runner: ubuntu-latest
          - Python: $(python --version 2>&1)
          - qpdf: $(qpdf --version | head -1)
          - Rules: 26
          - Case recipes: 130
          - Smoke PDFs: 28
          - Object self-checks: 28/28
          - PDFium expected outcomes: 28/28
          - qpdf expected outcomes: 28/28
          - Deterministic regeneration hashes: 28/28
          - Differential eCTD package harness self-test: PASS
          - CDE validator V1.1.0 observations: 0; NOT_RUN

          This record proves the synthetic harness gate only. It does not claim CDE validator equivalence.
          EOF

      - name: Commit only after all gates pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/p0-b0/materialize_p0_b0.py .github/workflows/p0-b0-validation.yml docs/validation/p0-b0 tests/p0_b0 tools/cde-validator PROJECT_STATUS.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "All success-state files already committed."
            exit 0
          fi
          git commit -m "test(p0-b0): record passing deterministic validation gate"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:agent/p0-b0-validation-matrix; then exit 0; fi
            git pull --rebase origin agent/p0-b0-validation-matrix
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload reproducible test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p0-b0-final-gate
          path: |
            build/p0-b0-smoke/
            build/p0-b0-gate-report.json
            build/ezctd-p0-b0-official-run.zip
          if-no-files-found: error
          retention-days: 30
