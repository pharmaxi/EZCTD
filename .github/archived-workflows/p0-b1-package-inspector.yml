name: P0-B1 candidate package inspector

on:
  push:
    branches:
      - agent/p0-b0-validation-matrix
    paths:
      - "tools/ectd/inspect_baseline_candidate.py"
      - "tests/p0_b1/test_baseline_candidate_inspector.py"
      - ".github/workflows/p0-b1-package-inspector.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0-b1-package-inspector
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-b0-validation-matrix
          fetch-depth: 0

      - name: Synchronize branch
        run: git pull --rebase origin agent/p0-b0-validation-matrix

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply current fixture and observer repairs
        run: |
          python tools/p0-b0/repair_materializer.py
          python tools/p0-b0/repair_materializer_v2.py
          python tools/p0-b0/repair_materializer_v3.py
          python tools/p0-b0/materialize_p0_b0.py
          python tools/p0-b1/repair_observer.py

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
          python -m pip install --upgrade pip
          python -m pip install -r tests/p0_b0/requirements.txt
          python -m pip install -e .

      - name: Generate smoke PDFs
        run: python tests/p0_b0/generators/generate_smoke_cases.py --manifest tests/p0_b0/smoke_manifest.json --output build/p0-b0-smoke

      - name: Run positive and negative package-inspector tests
        run: python tests/p0_b1/test_baseline_candidate_inspector.py build/p0-b0-smoke/CDE-PDF-BASELINE.pdf

      - name: Write success-only package-inspector marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('build/p0-b1-package-inspector-tests.json').read_text(encoding='utf-8'))
          assert report['status']=='PASS' and len(report['tests'])==3
          Path('docs/validation/p0-b1').mkdir(parents=True,exist_ok=True)
          Path('docs/validation/p0-b1/P0_B1_PACKAGE_INSPECTOR_GATE.md').write_text('''# P0-B1 candidate package inspector gate: PASS

- Internally consistent candidate package: accepted as `CANDIDATE_READY_FOR_OFFICIAL_VALIDATOR`
- Leaf checksum mismatch: rejected
- Missing context under strict mode: rejected
- Input mutation: none
- DTD/XSD/lifecycle validation: not yet implemented
- CDE eCTD validator V1.1.0: NOT_RUN

This gate proves only the implemented read-only package checks. It does not certify an eCTD sequence.
''',encoding='utf-8')
          PY

      - name: Commit success marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/p0-b0/materialize_p0_b0.py src/ezctd docs/validation/p0-b1/P0_B1_PACKAGE_INSPECTOR_GATE.md PROJECT_STATUS.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Package-inspector success state already committed."
            exit 0
          fi
          git commit -m "feat(p0-b1): pass candidate eCTD package inspector gate"
          for attempt in 1 2 3 4; do
            git pull --rebase origin agent/p0-b0-validation-matrix
            if git push origin HEAD:agent/p0-b0-validation-matrix; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload test evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-b1-package-inspector
          path: |
            build/p0-b1-package-inspector-tests.json
            build/p0-b0-smoke/CDE-PDF-BASELINE.pdf
          if-no-files-found: error
          retention-days: 30
