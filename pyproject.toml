[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ezctd"
version = "0.1.0.dev0"
description = "Evidence-first read-only PDF preflight experiments for CDE eCTD"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - private research repository" }
authors = [{ name = "EZCTD project" }]
dependencies = [
  "pikepdf>=9,<11",
  "pypdfium2>=4,<6",
]

[project.scripts]
ezctd = "ezctd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ezctd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.mypy]
python_version = "3.12"
strict = true
