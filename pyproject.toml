[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ezctd"
version = "0.4.0.dev0"
description = "Local clinical CRO PDF inspection, page services and safe batch workbench"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - private research repository" }
authors = [{ name = "EZCTD project" }]
dependencies = [
  "pikepdf>=10.5,<11",
  "pypdfium2>=5.8,<6",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
ui-test = ["playwright>=1.50,<2"]

[project.scripts]
ezctd = "ezctd.cli:main"
ezctd-workbench = "ezctd.workbench:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ezctd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.mypy]
python_version = "3.12"
strict = true
